name: protegeela
description: ProtegeEla is an open source Flutter PWA for trusted emergency alerts, privacy-preserving location sharing, and support resources.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  flutter_riverpod: ^2.5.1
  geolocator: ^12.0.0
  go_router: ^18.0.1
  intl: ^0.20.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  uuid: ^4.5.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/img/logo.png
    - assets/config/img/onboarding.png
    - assets/config/img/login-illustration.png
    - assets/config/img/register-illustration.png
