name: protegeela
description: ProtegeEla is an open source Flutter PWA for trusted emergency alerts, privacy-preserving location sharing, and support resources.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  flutter_riverpod: ^2.5.1
  geolocator: ^12.0.0
  go_router: ^14.2.7
  http: ^1.2.2
  intl: ^0.20.3
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  uuid: ^4.5.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/img/logo.png
    - assets/config/img/onboarding.png
    - assets/config/img/login-illustration.png
    - assets/config/img/register-illustration.png
