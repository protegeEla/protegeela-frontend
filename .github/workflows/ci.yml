name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib scripts test

      - name: Audit source organization
        run: dart run scripts/audit_frontend.dart

      - name: Analyze source
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build web release
        run: flutter build web --release --no-pub --csp --no-web-resources-cdn --dart-define=API_BASE_URL=https://api.example.invalid/api

      - name: Generate Netlify routing and security policy
        env:
          API_BASE_URL: https://api.example.invalid/api
        run: dart run scripts/configure_web_host.dart
